name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # pnpm/action-setup remains the supported action for the pinned pnpm 10 line.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm run audit:prod
      - run: npm pack --dry-run --ignore-scripts
      # A plain install (no --legacy-peer-deps) lets dsh resolve its own peer dependencies; with
      # them skipped, dsh boots but most of its plugins fail to import.
      - name: Install isolated DSH 0.2 smoke CLI
        run: >-
          npm install --prefix "$RUNNER_TEMP/dsh-02"
          @deepseek-ai/dsh@0.2.0-rc.2
          --ignore-scripts
      - name: Install packed plugin into a disposable web profile
        run: DSH_BIN="$RUNNER_TEMP/dsh-02/node_modules/.bin/dsh" npm run test:profile
