name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        description: Force a release without a merged PR carrying the release label
        default: false
      dry-run:
        type: boolean
        description: Skip npm publication; forced version bump and GitHub release still occur
        default: false

jobs:
  release:
    # BuildSpace v1 predates npm OIDC support. Use the current Photon workflow
    # until that support is included in a new immutable BuildSpace release tag.
    uses: photon-hq/buildspace/.github/workflows/typescript-service-release.yaml@main
    permissions:
      contents: write
      pull-requests: read
      id-token: write
      # GitHub validates every called-workflow job permission up front, even
      # though GitHub Packages publishing remains disabled for this package.
      packages: write
    with:
      service-name: dsh-imessage
      bun-version: "1.3"
      npm-tag: latest
      build-command: npm run check
      publish-command: npm publish --ignore-scripts
      use-oidc: true
      release: ${{ github.event_name == 'workflow_dispatch' && inputs.release || false }}
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs['dry-run'] || false }}
    # Inherit the Photon organization OPENAI_API_KEY. npm publishing remains
    # tokenless through the caller workflow's existing Trusted Publisher entry.
    secrets: inherit
